version: '3.8'

services:
  # ZeePass Application
  zeepass:
    build: 
      context: ..
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - GIN_MODE=release
      - PORT=8080
    depends_on:
      - redis
    networks:
      - zeepass-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s

  # Redis Database
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - zeepass-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Nginx Reverse Proxy with Logging
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - zeepass
    networks:
      - zeepass-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # GoAccess - Real-time Web Log Analyzer
  goaccess:
    image: allinurl/goaccess:latest
    ports:
      - "7890:7890"
    volumes:
      - nginx-logs:/var/log/nginx:ro
      - ./goaccess:/etc/goaccess:ro
      - goaccess-data:/var/lib/goaccess
    command: >
      goaccess /var/log/nginx/access.log
      --config-file=/etc/goaccess/goaccess.conf
      --output=/var/lib/goaccess/report.html
      --real-time-html
      --ws-url=ws://localhost:7890
      --port=7890
      --addr=0.0.0.0
      --daemonize
    depends_on:
      - nginx
    networks:
      - zeepass-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Uptime Monitor (Uptime Kuma)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    ports:
      - "3001:3001"
    volumes:
      - uptime-data:/app/data
    networks:
      - zeepass-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Netdata - Lightweight System Monitoring
  netdata:
    image: netdata/netdata:latest
    ports:
      - "19999:19999"
    volumes:
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    environment:
      - NETDATA_CLAIM_TOKEN=
      - NETDATA_CLAIM_ROOMS=
    networks:
      - zeepass-network
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  zeepass-network:
    driver: overlay
    attachable: true

volumes:
  redis-data:
  nginx-logs:
  goaccess-data:
  uptime-data: