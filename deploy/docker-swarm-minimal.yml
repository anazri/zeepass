version: '3.8'

services:
  # ZeePass Application
  zeepass:
    image: zeepass/zeepass:latest
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - zp-data:/app/data
    depends_on:
      - redis
    networks:
      - zeepass-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s

  # Redis Database
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - zeepass-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Nginx Reverse Proxy with Logging
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/html:/usr/share/nginx/html:ro
    command: >
      sh -c "
      rm -f /var/log/nginx/access.log /var/log/nginx/error.log &&
      touch /var/log/nginx/access.log /var/log/nginx/error.log &&
      chown nginx:nginx /var/log/nginx/*.log &&
      nginx -g 'daemon off;'"
    depends_on:
      - zeepass
    networks:
      - zeepass-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # Matomo - Web Analytics
  matomo:
    image: matomo:5-apache
    ports:
      - "8081:80"
    volumes:
      - matomo-data:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - zeepass-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Matomo Database
  db:
    image: mysql:8.0
    volumes:
      - matomo-db:/var/lib/mysql
    env_file:
      - .env
    networks:
      - zeepass-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Matomo Log Analytics (runs hourly)
  log-analytics:
    image: matomo/log-analytics:latest
    volumes:
      - ./nginx/logs:/logs:ro
      - matomo-data:/var/www/html:ro
    command: >
      sh -c "
      echo 'Starting log analytics...';
      while true; do
        echo 'Waiting 1 hour...';
        sleep 3600;
        echo 'Processing logs...';
        if [ -f /logs/access.log ]; then
          python /opt/matomo-log-analytics/import_logs.py --url=http://matomo:80 --login=admin --password=admin --recorders=4 /logs/access.log || echo 'Import failed';
        else
          echo 'No access.log found';
        fi;
      done"
    depends_on:
      - matomo
    networks:
      - zeepass-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Uptime Monitor (Uptime Kuma)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    ports:
      - "3001:3001"
    volumes:
      - uptime-data:/app/data
    networks:
      - zeepass-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Netdata - Lightweight System Monitoring
  netdata:
    image: netdata/netdata:latest
    ports:
      - "19999:19999"
    volumes:
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    env_file:
      - .env
    networks:
      - zeepass-network
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  zeepass-network:
    driver: overlay
    attachable: true

volumes:
  zp-data:
  redis-data:
  uptime-data:
  matomo-data:
  matomo-db: