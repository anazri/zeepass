version: '3.8'

services:
  # ZeePass Application
  zeepass:
    build: 
      context: ..
      dockerfile: Dockerfile
    container_name: zeepass-app
    expose:
      - "8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - GIN_MODE=release
      - PORT=8080
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@resend.dev}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-contact@moonkite.io}
    depends_on:
      - redis
    networks:
      - zeepass-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Database
  redis:
    image: redis:7-alpine
    container_name: zeepass-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - zeepass-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy with Logging
  nginx:
    image: nginx:alpine
    container_name: zeepass-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - zeepass
    networks:
      - zeepass-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GoAccess - Real-time Web Log Analyzer
  goaccess:
    image: allinurl/goaccess:latest
    container_name: zeepass-goaccess
    ports:
      - "7890:7890"
    volumes:
      - nginx-logs:/var/log/nginx:ro
      - ./goaccess:/etc/goaccess:ro
      - goaccess-data:/var/lib/goaccess
    command: >
      goaccess /var/log/nginx/access.log
      --config-file=/etc/goaccess/goaccess.conf
      --output=/var/lib/goaccess/report.html
      --real-time-html
      --ws-url=ws://localhost:7890
      --port=7890
      --addr=0.0.0.0
      --daemonize
    depends_on:
      - nginx
    networks:
      - zeepass-network
    restart: unless-stopped

  # Uptime Monitor (Uptime Kuma)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: zeepass-uptime
    ports:
      - "3001:3001"
    volumes:
      - uptime-data:/app/data
    networks:
      - zeepass-network
    restart: unless-stopped

  # Netdata - Lightweight System Monitoring
  netdata:
    image: netdata/netdata:latest
    container_name: zeepass-netdata
    ports:
      - "19999:19999"
    volumes:
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      - NETDATA_CLAIM_TOKEN=
      - NETDATA_CLAIM_ROOMS=
    networks:
      - zeepass-network
    restart: unless-stopped

networks:
  zeepass-network:
    driver: bridge

volumes:
  redis-data:
  nginx-logs:
  goaccess-data:
  uptime-data: