# GoAccess Configuration for ZeePass

# Time format
time-format %H:%M:%S

# Date format  
date-format %d/%b/%Y

# Log format for Nginx detailed logs
log-format %h %^[%d:%t %^] "%r" %s %b "%R" "%u" rt=%T uct="%^" uht="%^" urt="%^"

# Real-time HTML settings
real-time-html true
ws-url ws://localhost:7890

# Output settings
html-prefs {"theme":"bright","perPage":7,"layout":"horizontal","showTables":true,"showPanels":true,"chartType":0}

# Dashboard panels to show
ignore-panel REFERRERS
ignore-panel KEYPHRASES  
ignore-panel NOT_FOUND
ignore-panel REMOTE_USER

# Geographic data
geoip-database /usr/share/GeoIP/GeoLite2-City.mmdb

# Exclude static files and health checks
ignore-crawlers
exclude-ip 127.0.0.1
exclude-ip ::1

# Static file extensions to ignore for cleaner analytics
static-file .css
static-file .js  
static-file .jpg
static-file .jpeg
static-file .png
static-file .gif
static-file .ico
static-file .svg
static-file .woff
static-file .woff2
static-file .ttf
static-file .eot

# Anonymize IP addresses for privacy
anonymize-ip

# Keep last 30 days of data
keep-last 30

# Enable browsers and OS detection
browsers-file /etc/goaccess/browsers.list
os-file /etc/goaccess/opesys.list